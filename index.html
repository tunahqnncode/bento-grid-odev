<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technexus Grid Tasarımı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="discount-card">
            <img src="https://placehold.co/250x140" alt="İndirim kartı">
        </div>

        <div class="urbanist-card">
            <img src="https://placehold.co/160x202" alt="Urbanist yazı tipi">
        </div>

        <div class="building-card">
            <img src="https://placehold.co/160x202" alt="Technexus bina tabelası">
        </div>

        <div class="green-phone">
            <img src="https://placehold.co/250x295" alt="Yeşil toplar üzerindeki telefon">

        <div class="phone-screen">
            <img src="https://placehold.co/250x202" alt="Telefon ekranı">
        </div>

        <div class="logo-card">
            <img src="https://placehold.co/338x202" alt="Technexus logosu">
        </div>

        <div class="billboard-card">
            <img src="https://placehold.co/367x202" alt="Technexus reklam panosu">
        </div>

        <div class="slogan-card">
            <img src="https://placehold.co/222x202" alt="Connecting Ideas, Empowering Innovation">
